function unlockSounds(){
 try{
  if(!audioContext){
   const AudioCtx=window.AudioContext||window.webkitAudioContext;
   if(!AudioCtx)return;
   audioContext=new AudioCtx();
  }
  if(audioContext.state==="suspended"){
   audioContext.resume();
  }
 }catch(e){
  console.log("Audio tidak tersedia:",e);
 }
}

function playNotification(type){
 if(!audioContext||audioContext.state!=="running")return;

 const notes=type==="request"
  ?[660,880]
  :[880];

 notes.forEach((frequency,index)=>{
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();

  oscillator.type="sine";
  oscillator.frequency.value=frequency;
  gain.gain.setValueAtTime(0.0001,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
   0.15,audioContext.currentTime+0.02
  );
  gain.gain.exponentialRampToValueAtTime(
   0.0001,audioContext.currentTime+0.18
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  const start=audioContext.currentTime+index*0.22;
  oscillator.start(start);
  oscillator.stop(start+0.2);
 });
}

document.addEventListener("pointerdown",unlockSounds,{once:true});

function t(key){
 return (LANG[currentLanguage]||LANG.id)[key]||LANG.id[key]||key;
}
function toast(message){
 const el=document.getElementById("toast");
 el.textContent=message;el.style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.style.display="none",3000);
}
function safeText(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function avatarLetter(name){
 return safeText((name||"?").charAt(0).toUpperCase());
}
function setLanguageOptions(value){
 document.getElementById("languageSelect").value=value;
 document.getElementById("appLanguage").value=value;
}
function applyLanguage(){
 const keys={
  loginSubtitle:"subtitle",usernameLabel:"username",languageLabel:"language",
  loginButton:"login",loginNote:"loginNote",searchTitle:"search",
  searchInput:"searchPlaceholder",searchButton:"find",friendsTitle:"friends",
  requestsTitle:"requests",accountNote:"account"
 };
 for(const id in keys){
  const el=document.getElementById(id);
  if(!el)continue;
  const value=t(keys[id]);
  if(id==="searchInput")el.placeholder=value;
  else el.textContent=value;
 }
 document.getElementById("friendsTab").textContent=t("friends");
 document.getElementById("requestsTab").textContent=t("requests");
 document.getElementById("messageInput").placeholder=t("message");
 document.getElementById("sendButton").textContent="➤";
}
function changeLanguage(value){
 currentLanguage=LANG[value]?value:"id";
 localStorage.setItem("drawchat_language",currentLanguage);
 setLanguageOptions(currentLanguage);
 applyLanguage();
 if(currentUser){
  loadFriends();
  if(currentTab==="requests")loadRequests();
 }
}
function showTab(tab){
 currentTab=tab;
 document.getElementById("friendsTab").classList.toggle("active",tab==="friends");
 document.getElementById("requestsTab").classList.toggle("active",tab==="requests");
 document.getElementById("friendsPanel").classList.toggle("hidden",tab!=="friends");
 document.getElementById("requestsPanel").classList.toggle("hidden",tab!=="requests");
 if(tab==="friends")loadFriends();
 else loadRequests();
}
function usernameValid(name){
 return /^[a-zA-Z0-9_]{3,20}$/.test(name);
}

async function login(){
 const button=document.getElementById("loginButton");
 const username=document.getElementById("usernameInput").value.trim();
 currentLanguage=document.getElementById("languageSelect").value||"id";
 applyLanguage();

 if(!usernameValid(username)){
  toast(t("usernameInvalid"));return;
 }
 button.disabled=true;
 button.textContent=t("loading");

 try{
  let {data:{session},error:sessionError}=await db.auth.getSession();
  if(sessionError)throw sessionError;

  if(!session){
   const result=await db.auth.signInAnonymously();
   if(result.error)throw result.error;
   session=result.data.session;
  }
  currentUser=session.user;

  // Periksa apakah akun ini sudah memiliki username.
  const existing=await db.from("profiles")
   .select("id,username")
   .eq("id",currentUser.id)
   .maybeSingle();

  if(existing.error)throw existing.error;

  if(existing.data){
   myUsername=existing.data.username;
   if(!myUsername)throw new Error("Profile username is empty");
   if(username.toLowerCase()!==myUsername.toLowerCase()){
    toast(t("saved"));
   }
  }else{
   const {data:duplicate,error:duplicateError}=await db
    .from("profiles").select("id").ilike("username",username).limit(1);
   if(duplicateError)throw duplicateError;
   if(duplicate&&duplicate.length){
    throw new Error("USERNAME_TAKEN");
   }

   const {error:insertError}=await db.from("profiles").insert({
    id:currentUser.id,username:username
   });
   if(insertError){
    if(insertError.code==="23505")throw new Error("USERNAME_TAKEN");
    throw insertError;
   }
   myUsername=username;
  }

  localStorage.setItem("drawchat_language",currentLanguage);
  openApp();
 }catch(error){
  console.error(error);
  toast(error.message==="USERNAME_TAKEN"?t("usernameTaken"):t("loginError")+error.message);
  // Jangan sign out otomatis; sesi anonim mungkin sudah terbentuk.
 }finally{
  button.disabled=false;
  button.textContent=t("login");
 }
}

function openApp(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("myName").textContent="@"+myUsername;
 setLanguageOptions(currentLanguage);
 applyLanguage();
 showTab("friends");
 setupRealtime();
}

async function restoreSession(){
 currentLanguage=localStorage.getItem("drawchat_language")||"id";
 if(!LANG[currentLanguage])currentLanguage="id";
 setLanguageOptions(currentLanguage);
 applyLanguage();

 try{
  const {data:{session},error}=await db.auth.getSession();
  if(error)throw error;
  if(!session)return;
  currentUser=session.user;

  const {data,error:profileError}=await db.from("profiles")
   .select("id,username").eq("id",currentUser.id).maybeSingle();

  if(profileError)throw profileError;
  if(!data){
   // Akun anonim baru yang belum mempunyai username.
   document.getElementById("login").classList.remove("hidden");
   document.getElementById("usernameInput").placeholder="Pilih username";
   return;
  }
  myUsername=data.username;
  openApp();
 }catch(error){
  console.error(error);
  toast(t("accountError"));
 }
}

async function searchUsers(){
 const input=document.getElementById("searchInput");
 const query=input.value.trim();
 const box=document.getElementById("results");
 box.innerHTML="";
 if(query.length<2){toast(t("tooShort"));return}

 box.innerHTML='<div class="empty">'+safeText(t("loading"))+'</div>';
 try{
  const {data,error}=await db.rpc("search_profiles",{search_text:query});
  if(error)throw error;
  box.innerHTML="";
  if(!data||!data.length){
   box.innerHTML='<div class="empty">'+safeText(t("noResults"))+'</div>';
   return;
  }
  data.forEach(user=>{
   const row=document.createElement("div");
   row.className="item";
   row.innerHTML=`
    <div class="avatar">${avatarLetter(user.username)}</div>
    <div class="iteminfo"><strong>${safeText(user.username)}</strong>
     <span class="small muted">@${safeText(user.username)}</span></div>
    <div class="actions"><button class="primary">${safeText(t("add"))}</button></div>`;
   row.querySelector("button").onclick=()=>sendRequest(user.id);
   box.appendChild(row);
  });
 }catch(error){
  console.error(error);
  box.innerHTML="";
  toast(t("searchError")+" "+error.message);
 }
}

async function sendRequest(receiverId){
 try{
  const {data:existing,error:checkError}=await db.from("friend_requests")
   .select("id,status,sender_id,receiver_id")
   .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`);
  if(checkError)throw checkError;

  if(existing&&existing.some(r=>r.status==="accepted"||r.status==="pending")){
   toast(t("already"));return;
  }

  // Hapus permintaan lama yang ditolak agar boleh mengirim ulang.
  if(existing&&existing.length){
   for(const old of existing){
    if(old.status==="rejected"&&old.sender_id===currentUser.id){
     await db.from("friend_requests").delete().eq("id",old.id);
    }
   }
  }

  const {error}=await db.from("friend_requests").insert({
   sender_id:currentUser.id,receiver_id:receiverId,status:"pending"
  });
  if(error)throw error;
  toast(t("requestSent"));
 }catch(error){
  console.error(error);
  toast(t("requestError")+" "+error.message);
 }
}

async function loadFriends(){
 if(!currentUser)return;
 const box=document.getElementById("friends");
 box.innerHTML='<div class="empty">'+safeText(t("loading"))+'</div>';
 try{
  const {data,error}=await db.from("friend_requests")
   .select("sender_id,receiver_id,status")
   .eq("status","accepted")
   .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);
  if(error)throw error;

  const ids=[...new Set((data||[]).map(r=>
   r.sender_id===currentUser.id?r.receiver_id:r.sender_id
  ))];
  box.innerHTML="";
  if(!ids.length){
   box.innerHTML='<div class="empty">'+safeText(t("emptyFriends"))+'</div>';
   return;
  }

  const {data:profiles,error:profileError}=await db.from("profiles")
   .select("id,username").in("id",ids);
  if(profileError)throw profileError;

  (profiles||[]).forEach(friend=>{
   const row=document.createElement("div");
   row.className="item";
   row.innerHTML=`
    <div class="avatar">${avatarLetter(friend.username)}</div>
    <div class="iteminfo"><strong>${safeText(friend.username)}</strong>
    <span class="small muted">${safeText(t("chat"))}</span></div>
    <div class="actions"><button class="primary">${safeText(t("chat"))}</button></div>`;
   row.querySelector("button").onclick=()=>openChat(friend);
   box.appendChild(row);
  });
 }catch(error){
  console.error(error);
  box.innerHTML='<div class="empty">'+safeText(error.message)+'</div>';
 }
}

async function loadRequests(){
 if(!currentUser)return;
 const box=document.getElementById("requests");
 box.innerHTML='<div class="empty">'+safeText(t("loading"))+'</div>';
 try{
  const {data,error}=await db.from("friend_requests")
   .select("id,sender_id,created_at")
   .eq("receiver_id",currentUser.id).eq("status","pending")
   .order("created_at",{ascending:false});
  if(error)throw error;
  box.innerHTML="";
  if(!data||!data.length){
   box.innerHTML='<div class="empty">'+safeText(t("emptyRequests"))+'</div>';
   return;
  }

  const ids=data.map(r=>r.sender_id);
  const {data:profiles,error:profileError}=await db.from("profiles")
   .select("id,username").in("id",ids);
  if(profileError)throw profileError;
  const map={};
  (profiles||[]).forEach(p=>map[p.id]=p.username);

  data.forEach(request=>{
   const name=map[request.sender_id]||"Unknown";
   const row=document.createElement("div");
   row.className="item";
   row.innerHTML=`
    <div class="avatar">${avatarLetter(name)}</div>
    <div class="iteminfo"><strong>${safeText(name)}</strong>
    <span class="small muted">${safeText(t("requests"))}</span></div>
    <div class="actions">
     <button class="primary accept">${safeText(t("accept"))}</button>
     <button class="danger reject">${safeText(t("reject"))}</button>
    </div>`;
   row.querySelector(".accept").onclick=()=>answerRequest(request.id,"accepted");
   row.querySelector(".reject").onclick=()=>answerRequest(request.id,"rejected");
   box.appendChild(row);
  });
 }catch(error){
  console.error(error);
  box.innerHTML='<div class="empty">'+safeText(error.message)+'</div>';
 }
}

async function answerRequest(id,status){
 try{
  const {data,error}=await db.from("friend_requests")
   .update({status})
   .eq("id",id).eq("receiver_id",currentUser.id)
   .eq("status","pending").select("id");
  if(error)throw error;
  if(!data||!data.length)throw new Error("Request not found");
  toast(status==="accepted"?t("accepted"):t("rejected"));
  loadRequests();
  loadFriends();
 }catch(error){
  console.error(error);
  toast(t("requestFailed")+" "+error.message);
 }
}

async function openChat(friend){
 activeFriend=friend;
 document.getElementById("homeView").classList.add("hidden");
 document.getElementById("chatView").classList.remove("hidden");
 document.getElementById("chatName").textContent=friend.username;
 document.getElementById("chatAvatar").textContent=avatarLetter(friend.username);
 document.getElementById("chatStatus").textContent=t("chat");
 await loadMessages();
 document.getElementById("messageInput").focus();
}

function closeChat(){
 activeFriend=null;
 document.getElementById("chatView").classList.add("hidden");
 document.getElementById("homeView").classList.remove("hidden");
}

async function loadMessages(){
 if(!activeFriend||!currentUser)return;
 const box=document.getElementById("chatMessages");
 box.innerHTML='<div class="empty">'+safeText(t("loading"))+'</div>';
 const friendId=activeFriend.id;
 try{
  const filter=`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`;
  const {data,error}=await db.from("private_messages")
   .select("id,sender_id,receiver_id,body,created_at")
   .or(filter).order("created_at",{ascending:true}).limit(5000);
  if(error)throw error;
  if(!activeFriend||activeFriend.id!==friendId)return;
  renderMessages(data||[]);
 }catch(error){
  console.error(error);
  box.innerHTML='<div class="empty">'+safeText(error.message)+'</div>';
 }
}

function renderMessages(messages){
 const box=document.getElementById("chatMessages");
 box.innerHTML="";
 if(!messages.length){
  box.innerHTML='<div class="empty">'+safeText(t("noMessage"))+'</div>';
  return;
 }
 messages.forEach(message=>{
  const mine=message.sender_id===currentUser.id;
  const bubble=document.createElement("div");
  bubble.className="bubble"+(mine?" mine":"");
  const date=new Date(message.created_at);
  const time=date.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  bubble.innerHTML=`${safeText(message.body)}<time>${time}</time>`;
  box.appendChild(bubble);
 });
 box.scrollTop=box.scrollHeight;
}

async function sendMessage(event){
 event.preventDefault();
 if(!activeFriend)return;
 const input=document.getElementById("messageInput");
 const body=input.value.trim();
 if(!body){toast(t("typeMessage"));return}
 const receiver=activeFriend.id;
 const button=document.getElementById("sendButton");
 button.disabled=true;
 try{
  const {error}=await db.from("private_messages").insert({
   sender_id:currentUser.id,receiver_id:receiver,body
  });
  if(error)throw error;
  input.value="";
  await loadMessages();
 }catch(error){
  console.error(error);
  toast(t("messageError")+" "+error.message);
 }finally{
  button.disabled=false;
  input.focus();
 }
}

function setupRealtime(){
 if(realtimeChannel){
  db.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }
 realtimeChannel=db.channel("draw-chat-"+currentUser.id)
  .on("postgres_changes",{
 event:"*",schema:"public",table:"friend_requests"
},payload=>{
 const request=payload.new;

 if(
  payload.eventType==="INSERT" &&
  request.receiver_id===currentUser.id &&
  request.status==="pending"
 ){
  playNotification("request");
 }

 if(currentTab==="friends")loadFriends();
 if(currentTab==="requests")loadRequests();
})
  .on("postgres_changes",{
   event:"INSERT",schema:"public",table:"private_messages"
  },payload=>{
   const msg=payload.new;
   if(!activeFriend)return;
   const isThisChat=
    (msg.sender_id===currentUser.id&&msqg.receiver_id===activeFriend.id)||
    (msg.sender_id===activeFriend.id&&msg.receiver_id===currentUser.id);
   if(isThisChat){
 if(msg.sender_id!==currentUser.id){
  playNotification("message");
 }
 loadMessages();
}
  })
  .subscribe();
}

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden&&currentUser){
  if(currentTab==="friends")loadFriends();
  if(currentTab==="requests")loadRequests();
  if(activeFriend)loadMessages();
 }
});

restoreSession();
</script>

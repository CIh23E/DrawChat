
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw Chat Cool</title>
<meta name="description" content="Draw Chat Cool - Chat privat bersama teman.">
</head>
<body>
<div id="status">Memuat Draw Chat...</div>
<script>
fetch("https://pastefy.app/LPVi8vmk/raw")
.then(response => {
  if (!response.ok) throw new Error("Gagal mengambil kode");
  return response.text();
})
.then(html => {
  document.open();
  document.write(html);
  document.close();
})
.catch(error => {
  document.getElementById("status").textContent =
    "Gagal memuat Draw Chat: " + error.message;
});
</script>
</body>
</html>
